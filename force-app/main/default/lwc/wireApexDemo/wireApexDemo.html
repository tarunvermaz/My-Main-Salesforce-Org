<template>

    <lightning-card title="Related Contacts" icon-name="custom:custom14">
        <ul class="slds-m-around-medium">

            <template if:true={record.data}>
                <lightning-formatted-text value={name} class="slds-text-heading-Large">
                </lightning-formatted-text>
            </template>

            <template for:each={contacts} for:item="contact">
                <li key={contact.Id}>
                    {contact.FirstName} - {contact.LastName}
                </li>
            </template>
            <template if:true={record.error}>

            </template>

        </ul>
    </lightning-card>

</template>
