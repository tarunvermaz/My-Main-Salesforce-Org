<!-- 3. lightning-record-edit-form (Custom Form) -->

<template>

    <lightning-card title="Edit Account">

        <lightning-record-edit-form
            object-api-name="Account"
            record-id={recordId}>

            <lightning-input-field field-name="Name">
            </lightning-input-field>

            <lightning-input-field field-name="Phone">
            </lightning-input-field>

            <lightning-button
                type="submit"
                label="Save">
            </lightning-button>

        </lightning-record-edit-form>

    </lightning-card>

</template>
