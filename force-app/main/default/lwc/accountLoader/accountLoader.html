<template>

    <lightning-card title="Account Loader">

        <div class="slds-p-around_medium">

            <lightning-button label="Load Accounts" onclick={loadAccounts}>
            </lightning-button>

            <template lwc:if={accounts.length}>

                <template for:each={accounts} for:item="account">

                    <p key={account.Id}>
                        {account.Name} - {account.Phone}
                    </p>

                </template>

            </template>

        </div>

    </lightning-card>

</template>
