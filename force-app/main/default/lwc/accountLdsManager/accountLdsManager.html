<template>

    <lightning-card title="Account LDS Manager">

        <!-- 1. RECORD FORM -->
        <lightning-record-form
            record-id={recordId}
            object-api-name="Account"
            layout-type="Compact"
            mode="view">
        </lightning-record-form>


        <!-- 2. CUSTOM VIEW FORM -->
        <div class="slds-p-around_medium">

            <h2>Custom Account View</h2>

            <lightning-record-view-form
                record-id={recordId}
                object-api-name="Account">

                <lightning-output-field
                    field-name="Name">
                </lightning-output-field>

                <lightning-output-field
                    field-name="Phone">
                </lightning-output-field>

                <lightning-output-field
                    field-name="Industry">
                </lightning-output-field>

            </lightning-record-view-form>

        </div>


        <!-- 3. CUSTOM EDIT FORM -->
        <div class="slds-p-around_medium">

            <h2>Edit Account</h2>

            <lightning-record-edit-form
                record-id={recordId}
                object-api-name="Account"
                onsuccess={handleSuccess}>

                <lightning-input-field
                    field-name="Name">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Phone">
                </lightning-input-field>

                <lightning-input-field
                    field-name="Industry">
                </lightning-input-field>

                <lightning-button
                    type="submit"
                    label="Save">
                </lightning-button>

            </lightning-record-edit-form>

        </div>


        <!-- 4. GET RECORD DATA -->
        <div class="slds-p-around_medium">

            <h2>Data From getRecord()</h2>

            <p>
                Name: {accountName}
            </p>

            <p>
                Phone: {accountPhone}
            </p>

        </div>


        <!-- 5. CRUD BUTTONS -->
        <div class="slds-p-around_medium">

            <lightning-button
                label="Create Account"
                onclick={createAccount}>
            </lightning-button>

            <lightning-button
                label="Update Account"
                onclick={updateAccount}
                class="slds-m-left_small">
            </lightning-button>

            <lightning-button
                label="Delete Account"
                onclick={deleteAccount}
                class="slds-m-left_small">
            </lightning-button>

        </div>

    </lightning-card>

</template>
